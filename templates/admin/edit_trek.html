{% extends "base.html" %}

{% block title %}Edit Trek{% endblock %}

{% block content %}

<div class="container mt-4">


<h2 class="text-center mb-4">Edit Trek</h2>

<div class="card bg-dark text-white p-4">

    <form method="POST">

        <!-- Trek Name & Location -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Trek Name</label>
                <input type="text" name="trek_name" class="form-control"
                       value="{{ trek.trek_name }}" required>
            </div>

            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" name="location" class="form-control"
                       value="{{ trek.location }}" required>
            </div>
        </div>

        <!-- Difficulty & Duration -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Difficulty</label>
                <select name="difficulty" class="form-control">
                    <option value="Easy" {% if trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
                    <option value="Moderate" {% if trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
                    <option value="Hard" {% if trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Duration (Days)</label>
                <input type="number" name="duration" class="form-control"
                       value="{{ trek.duration }}">
            </div>
        </div>

        <!-- Dates -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control"
                       value="{{ trek.start_date.strftime('%Y-%m-%d') }}">
            </div>

            <div class="col-md-6">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control"
                       value="{{ trek.end_date.strftime('%Y-%m-%d') }}">
            </div>
        </div>

        <!-- Slots -->
        <div class="row mb-3">
            <div class="col-md-6">
                <label class="form-label">Available Slots</label>
                <input type="number" name="available_slots" class="form-control"
                       value="{{ trek.available_slots }}">
            </div>
        </div>

        <!-- Buttons -->
        <div class="text-center">
            <button type="submit" class="btn btn-success">Update Trek</button>
            <a href="/admin/dashboard" class="btn btn-secondary">Cancel</a>
        </div>

    </form>

</div>

</div>

{% endblock %}
